 FRA.1.t: "黑色圣诞节"
 FRA.1.d: "12月25日，耶稣诞生的日子。\n9时12分，雷诺汽车的股票开始暴跌\n12时07分，雷诺汽车股价从216法郎暴跌到107法郎，同时施耐德，道达尔法国电力公司，标致集团股价均下降40点\n13时14分，法国巴黎银行联合七家银行共出资一亿四千万法郎援助股市\n14点26分，股市开股\n15点35分，股市仍在下跌\n12月29日，股市下降至最低点，股票价格一夜之间从顶巅跌入深渊，价格下跌之快，连股票行情自动显示器都跟不上，成千上万的法国人只能看着他们一生的积蓄烟消云散\n从巴黎到符拉迪沃斯托克，整个世界都陷入了经济危机的旋涡中......"
 FRA.1.a: "[FRAECONOMICBAD]"
