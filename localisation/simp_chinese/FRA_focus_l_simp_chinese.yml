l_simp_chinese:
 french_focus_1935: "1935"
 FRA_fontainebleau: "枫丹白露"
 FRA_fontainebleau_desc: "拿破仑五世为帝国付出了太多心血，是时候将帝国传承给富有活力的年轻人们了。但在那之前，拿破仑五世觉得有必要再提醒一下他的孩子，他肩上的责任有多么重。"
 FRA_Camille_Chautemp_cabinet: "卡米耶·肖当内阁"
 FRA_Camille_Chautemp_cabinet_desc: "肖当的内阁似乎是广受好评的，他能和来自各界党派的朋友进行着各种巧妙的谈判。尽管他的能力并不如他的前辈们，他仍然在进行着他的改革，朝着更加进步，或是更加现实的方向。"
 FRA_responsible_to_emperor: "我们对皇帝负责"
 FRA_responsible_to_emperor_desc: "法国政府虽说是立宪制的，可是皇帝仍然保有极大的影响力与权力。若要使内阁能在法国政坛中生存下去，皇帝的支持便显得尤为重要，尽管我们会为此付出一定的代价。"
 FRA_responsible_to_parliament: "我们对议会负责"
 FRA_responsible_to_parliament_desc: "议会选择了我们，我们自然要为选民负责，要为议会负责。要给他们看看，他们投在我们身上的每一张选票并没有被辜负。"
 FRA_Efforts_to_stabilize_order: "为稳定秩序的努力"
 FRA_Efforts_to_stabilize_order_desc: "社会要有伦理才有秩序，才能将人与人之间的各种自然差异融合在一起。所谓的平等是履行相应职责、扮演各自角色、享受基本权利的平等，而不是为所欲为、理想化的平等。\n\n为了维护秩序做出的那些努力，尽管手段有些粗暴，但这仍然是十分必要的。"
 FRA_Mandatory_Arbitration_Act: "强制仲裁法案"
 FRA_Mandatory_Arbitration_Act_desc: "《强制仲裁法案》将雇主与员工之间的矛盾转为强制性地通过法院裁定，将二者之间的矛盾从各种手段转为政府管控，一定程度上给了员工表达诉求的空间，保障了社会生产生活的稳定。"
 FRA_Aspirations_for_freedom_and_equality: "为自由平等的愿望"
 FRA_Aspirations_for_freedom_and_equality_desc: "只有在一个平等的社会里，每个人的基本权利才能得到充分的保护，如言论自由、宗教信仰自由、受教育权等。只有在一个自由的环境中，人类的大脑才能肆意地发挥其聪明才智，社会才会充满生机。为了自由平等的愿望，付出多少都是值得的。"
 FRA_nothing_wrong_with_that: "并没有什么不好"
 FRA_nothing_wrong_with_that_desc: "在维护秩序的过程中，难免会遇到阻碍。街头的抗议和密谋的沙龙都是社会的不稳定因素，对这些行为我们不得不采取相应措施乃至使用暴力。尽管有违初衷，但这是我们理想实现要做出的必要的代价"
 FRA_Extension_of_the_age_of_compulsory_education: "延长义务教育年龄"
 FRA_Extension_of_the_age_of_compulsory_education_desc: "我们如果要使国家彻底摆脱宗教、贫困和愚昧的影响，那么对更多人的无私教化是我们的不二之选。这在短期内可能不会给我们带来什么实质性的好处，但站在长远上，这是伟大的事业。"
