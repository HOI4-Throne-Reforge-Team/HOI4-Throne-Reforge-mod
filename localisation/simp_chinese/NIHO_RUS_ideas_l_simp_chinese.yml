l_simp_chinese:
 #民族精神   俄罗斯代码由fod组长场外支援，由于我个人习惯导致我不喜欢写注释，所以一切的代码都请从汉化中倒推
 Neva_Economic_Community: "涅瓦经济共同体"
 Trans_Siberian_Railway: "西伯利亚大铁路"
 Alexander_Reforms: "亚历山大改革"
 the_Imperial_Russian_Army: "俄罗斯帝国陆军"

 Neva_Economic_Community_desc: "帝国的各个自治领在世界大战中为帝国做出了杰出的贡献，无论是来自波兰，芬兰还是来自波罗的海的忠实子民都在世界大战中为帝国英勇献身。如今在战争胜利后，我们理应奖赏我们忠诚的自治领，适当放血来为涅瓦公约的共同繁荣而努力…….或者，我们也可以借由经济共同体加倍压榨我们的盟国和自治领。毕竟一切为了帝国"
 Trans_Siberian_Railway_desc: "西伯利亚大铁路于1891年5月在海参崴正式动工，1892年又从另一端的车里亚宾斯克往东修建，至1904年经过帝国各部门的齐心努力而彻底完工。这条铁路能够将西伯利亚的自然资源源源不断运输回帝国的核心工业区，也可以通过铁路为铁道周边城市带来经济繁荣和来自帝国核心区域的援助与投资"
 Alexander_Reforms_desc: "自从1861年“全俄罗斯土地改革草案”被强硬执行后至今74年的亚历山大改革进程已经让帝国毫无疑问的成为了全世界最强大列强之一。但是令人遗憾的是，经过来自1920年发生的战后大规模社会动荡，我们的帝国曾经曾经一度陷入了大规模的通货紧缩。但是由于帝国杜马和沙皇果断的决定，通过帝国银行的帮助让我们顺利解决了大规模的经济动荡，我们通过更多社会福利和法律承诺将帝国变得更加稳定，只要不产生更大的社会问题和经济问题，俄罗斯帝国的稳定就不会被轻易破坏"
 the_Imperial_Russian_Army_desc: "俄罗斯帝国的总参谋部历史承袭普鲁士王国流亡军官团和圣彼得堡军事学院的优良传统，这来源于1865年后的帝国陆军改革和普鲁士革命后吸收普鲁士流亡军官团。自那之后，我们帝国陆军就建立了完善的总参谋部系统，不过在世界大战结束后伴随而来的1921年经济危机，帝国的基层陆军也陷入了混乱和罢工，而杜马和沙皇为了平息事端，选择提升基层士兵的待遇，所以我们现在不得不需要更多补给以供养我们精良的帝国陆军。而还有一个坏消息：如今我们的陆军在世界大战结束后便陷入了普鲁士总参谋部派与传统俄式派的争斗，无论是哪一方获胜，我们的帝国陆军在此之前都要混乱一段时间"
