 denmark.5.t: "格陵兰暴动"
 denmark.5.d: "格陵兰的独立分子袭击了政府大楼,并且宣布了格陵兰的独立,从今日起,格陵兰就将再也不是丹麦的一部分."
 denmark.5.a: "随它去吧..."
 denmark.4.t: "石勒苏益格-荷尔施泰因的独立"
 denmark.4.d: "石勒苏益格-荷尔施泰因的德意志民族主义分子宣布了独立"
 denmark.4.a: "随它去吧..."
 denmark.3.t: "哈康的电报..."
 denmark.3.d: "挪威宣布与丹麦断绝宗主关系,正式脱离丹麦"
 denmark.3.a: "随它去吧..."
 denmark.2.t: "冰岛的独立"
 denmark.2.d: "冰岛的民族主义分子与格陵兰的民族主义分子合作,宣布了独立"
 denmark.2.a: "随它去吧..."
 denmark.1.t: "戒严令!!!"
 denmark.1.d: "克里斯蒂安国王发布了戒严令,哥本哈根全城陷入寂静,宵禁开始实施,全国军队开始紧急动员."
 denmark.1.a: "..."
